# Secrets (JWT_SECRET, MAIL_USERNAME, MAIL_PASSWORD, GOOGLE_BOOKS_API_KEY)
# come from the host environment or a gitignored .env file. Never put real
# credentials in this file.
services:
  api:
    build:
      context: .
      target: base
    container_name: curiculy_api
    ports:
      - "3040:80"
    environment:
      CATALOG_DATABASE_URL: sqlite:////data/catalog.db
      TENANT_DATABASE_URL: sqlite:////data/tenant.db
      ADMIN_DATABASE_URL: sqlite:////data/admin.db
      EVIDENCE_DIR: /data/evidence
      INDEX_HTML_PATH: /app/index.html
      STATIC_DIR: /app/static
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      DEV_MODE: ${DEV_MODE:-false}
      MAIL_SERVER: ${MAIL_SERVER:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-portfolios@curiculy.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Curiculy}
      MAIL_STARTTLS: "true"
      MAIL_SSL_TLS: "false"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data # NVMe drive for SQLite databases
      - /datalake/projects/curiculy/evidence:/data/evidence # 30TB array for photos
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./static:/app/static
      - ./index.html:/app/index.html
      - ./sw.js:/app/sw.js
    # Shows as healthy/unhealthy in `docker ps` and to an uptime monitor.
    # Checks the process and catalog/admin databases, not each household file.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Nightly backups, off until enabled: docker compose --profile backup up -d backup
  # Snapshots every database (checked) and mirrors new evidence files into
  # BACKUP_HOST_DIR (default ./backups), keeping the newest 14. See README.
  backup:
    build:
      context: .
      target: base
    container_name: curiculy_backup
    profiles: ["backup"]
    entrypoint:
      - sh
      - -c
      - >-
        while true;
        do python scripts/backup.py --data-dir /data --evidence-dir /data/evidence --dest /backups --keep 14;
        sleep 86400;
        done
    volumes:
      - ./data:/data
      - /datalake/projects/curiculy/evidence:/data/evidence:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./scripts:/app/scripts
    restart: unless-stopped

  tests:
    build:
      context: .
      target: dev
    image: curiculy-tests:latest
    profiles: ["dev"]
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./ruff.toml:/app/ruff.toml
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./sw.js:/app/sw.js
      - ./index.html:/app/index.html
      - ./static:/app/static
      - ./extension:/app/extension
      - ./README.md:/app/README.md
      - ./.github:/app/.github
    command: ["pytest"]
